name: Aggiorna prezzi

on:
  schedule:
    # Alle 8:00 e 14:00 UTC: 10:00 e 16:00 italiane con l'ora legale, 9:00 e 15:00 con la solare.
    # Il file open data esce verso le 9 italiane; il secondo run è una riserva se GitHub salta il primo.
    # I prezzi in tempo reale dei preferiti li scarica l'app a ogni apertura.
    - cron: "0 8,14 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    # Rete di sicurezza se i server del MIMIT smettono di rispondere.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sempre l'ultima versione di master, anche quando si rilancia un run vecchio.
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Se data.json è stato aggiornato a mano (scripts/aggiorna_a_mano.py) si pubblica e basta.
      - name: Scarica i prezzi dal MIMIT
        if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Prezzi aggiornati a mano')) }}
        run: python scripts/aggiorna.py

      - name: Salva data.json nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Prezzi aggiornati $(date -u +%Y-%m-%d)"
          git pull --rebase origin master
          git push

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v5
